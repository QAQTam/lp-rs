[package]
name = "lp-payload-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Android OTA payload.bin reader: CrAU container parsing + DeltaArchiveManifest (pure Rust prost)"
keywords = ["android", "ota", "payload", "update-engine"]
categories = ["parser-implementations", "command-line-utilities"]

[lib]
name = "lp_payload"
path = "src/lib.rs"

[[bin]]
name = "payload-ls"
path = "src/bin/payload_ls.rs"

[dependencies]
anyhow.workspace = true
prost.workspace = true
sha2.workspace = true
thiserror.workspace = true
clap.workspace = true
bzip2 = "0.6"
xz2 = { version = "0.1", features = ["static"] }
ruzstd = "0.9"

[features]
trace-steps = []
