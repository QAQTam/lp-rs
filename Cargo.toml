[workspace]
resolver = "2"
members = [
    "crates/lp-sparse-rs",
    "crates/liblp-rs",
    "crates/lp-tools-rs",
    "crates/lp-payload-rs",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["QAQTam"]
repository = "https://github.com/QAQTam/lp-rs"

[workspace.dependencies]
lp-sparse-rs = { version = "0.2.0", path = "crates/lp-sparse-rs" }
liblp-rs = { version = "0.2.0", path = "crates/liblp-rs" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
indicatif = "0.18"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["derive"] }
