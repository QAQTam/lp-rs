name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_windows: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            is_windows: true
          - os: macos-latest
            target: aarch64-apple-darwin
            is_windows: false
          - os: macos-latest
            target: x86_64-apple-darwin
            is_windows: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build lp-tools-rs release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p lp-tools-rs

      - name: Package Unix archive
        if: ${{ !matrix.is_windows }}
        shell: bash
        run: |
          archive="lp-tools-rs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          mkdir -p stage
          for bin in lpmake lpunpack lpdump lpadd lpflash; do
            cp "target/${{ matrix.target }}/release/$bin" stage/
          done
          cp LICENSE NOTICE README.md stage/
          tar -czf "$archive" -C stage .
          echo "ARCHIVE_FILE=$archive" >> "$GITHUB_ENV"

      - name: Package Windows archive
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          $archive = "lp-tools-rs-${{ github.ref_name }}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          foreach ($bin in @("lpmake", "lpunpack", "lpdump", "lpadd", "lpflash")) {
            Copy-Item "target/${{ matrix.target }}/release/$bin.exe" stage/
          }
          Copy-Item LICENSE, NOTICE, README.md stage/
          Compress-Archive -Path stage/* -DestinationPath $archive
          "ARCHIVE_FILE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARCHIVE_FILE }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
